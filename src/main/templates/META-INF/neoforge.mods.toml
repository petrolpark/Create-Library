modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/petrolpark/Create-Library/issues/10"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://www.modrinth.com/mod/petrolpark"
logoFile="logo.png"
authors="${mod_authors}"
description='''${mod_description}'''
enumExtensions="META-INF/enumextensions.json"
featureFlags="META-INF/feature_flags.json"

[[mixins]]
config="${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
	modId ="create"
	type ="optional"
	versionRange ="[6.0.10,6.0.11)"
    reason = "This library modifies Create using mixins, whose targets may change in newer updates"
	ordering = "AFTER"
	side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "jei"
    type = "optional"
    versionRange = "[19.39.0.370,19.40.0.0)"
    reason = "This library modifies JEI using mixins, whose targets may change in newer updates"
    ordering = "AFTER"
    side = "CLIENT"